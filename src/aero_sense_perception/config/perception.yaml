# How the drone decides something is a person.
#
# Two cues. LWIR separates a warm body from rubble in a scene where everything else sits at
# ambient. RGB shape (rgb_detector: YOLO11n fine-tuned on overhead views, ml/) also finds people with
# no heat to show, like the deceased casualty, and bodies the thermal threshold misses.

detector:
  # Ground is 298 K and asphalt 301 K; a live body is 306-311 K. gz quantises heat to ~2.6 K,
  # so the threshold sits a full step above the warmest surface.
  min_temperature_k: 304.0
  # The smallest warm patch that counts, as ground area rather than pixels, so the same part of a
  # person counts from any height: a forearm and hand reaching out of rubble is ~0.01 m2 from above.
  # victim_detector turns it into pixels for the drone's height each frame, never below 1 px (no
  # surface in the scene reaches the threshold and the thermal camera has no noise, so one warm pixel
  # is something warm). With the 256x192 core that is 1 px from 30 m and 4 px from SWOOP's 10 m
  # close look; a person lying in the open covers 25-50 px from 30 m.
  min_blob_m2: 0.008
  max_blob_px: 4000
  # Confidence reaches 1.0 this far above the threshold (a 310 K body against 304 K).
  confidence_span_k: 6.0

tracker:
  # Two detections within this distance in the map frame are the same casualty. Wide enough to
  # absorb projection error at altitude, tight enough to keep neighbours apart.
  associate_radius_m: 6.0
  # A track is only published once seen this many times: one hot frame is not a casualty.
  confirm_hits: 3
  # BYTE: only a detection at least this confident starts a casualty; weaker ones only extend one.
  # Thermal confidence comes in gz's 2.6 K steps, 0.31 / 0.73 / 1.0, and every step starts one:
  # from 0.4 up, a casualty seen only at 306 K (V05, flight_bytetrack) was never found.
  new_track_confidence: 0.3
  # Tracks not seen again for this long stop being republished as current.
  forget_after_s: 60.0

# SWOOP (Suspect, Weigh, Observe Overhead, Prove): faint or tiny heat that is not a confirmed
# casualty, rated by how likely it is to be a person. The mission flies down to any suspect at or
# above its own threshold (5 %) to verify it. See aero_sense_perception/suspects.py.
suspects:
  # One gz heat quantisation step (~2.6 K): contrast below it is indistinguishable from the ground.
  noise_k: 2.5
  # Full contrast of a live body over sun-warmed ground (308 K on 298 K).
  body_contrast_k: 10.0
  # Warmer than every surface (asphalt 301 K, one quantisation step on): ground showing between the
  # cold walls of collapsed buildings is a local warm feature too, but no warmer than ground.
  min_peak_k: 303.0
  # Published from here up; the mission decides which are worth the descent.
  min_probability: 0.05
  # looks within this distance in the map frame are the same lead
  associate_radius_m: 6.0
  # no leads until the drone is this high: on the pad the camera sees its own skids and the pad
  min_height_m: 5.0
  # a lead is published once seen this often: a single frame taken mid-bank projects a real
  # casualty metres off and made ghost leads the drone flew down to for nothing
  min_looks: 3

# The RGB person detector (rgb_detector, ml/models/yolo11n_aerial). On the scenario's casualties,
# rendered from 8-34 m (ml/README.md): 67 % found in a frame at confidence 0.35, 41 % at 0.55 with
# 4 false positives in 184 frames. Its detections go where thermal ones go:
rgb:
  model: yolo11n_aerial.pt          # in this package's share/models (ml/models/yolo11n_aerial)
  imgsz: 960                        # the frame's own width: shrinking loses 10-pixel people
  rate_hz: 3.0                      # frames looked at per second; a casualty stays in view for seconds
  # only people within this angle of straight down: the camera sees 127 deg across, and off to the
  # side a person on a 5 m terrace projects metres from where they are, while walls and windows
  # seen edge-on made leads nobody was at (three wasted SWOOP descents over the flood). Within 35 deg
  # 5 m of height is at most 3.5 m off, inside the tracker's 6 m, and from 30 m the cone is still
  # 42 m across, wider than the 25 m between search legs.
  max_off_nadir_deg: 35.0
  # every person this confident is published, and is a SWOOP lead once seen min_looks times
  # (suspects:) in one place: the descent then proves it or rules it out
  lead_confidence: 0.35
  # and a casualty for the tracker when this confident, seen from this low (SWOOP's close look; the
  # fewer false positives come from nearer): three such looks confirm someone with no heat at all.
  # 20 m, not 10: beside a building SWOOP stops 5.5 m above it (V09's lead verified from 16 m and
  # 15 m ruled them out); still below inspection (22 m) and search (30 m)
  confirm_confidence: 0.5
  confirm_max_height_m: 20.0
