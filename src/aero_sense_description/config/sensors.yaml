# Aero Sense hexacopter and its sensor payload. This one table drives the Gazebo model (templates/drone.sdf.jinja),
# the ros_gz_bridge config and the sensor TF frames (aero_sense_description/render.py), so a
# sensor's Gazebo topic, ROS topic and frame cannot drift apart.
#
# Every camera is the real part's: field of view, range and (for the Lepton) resolution come from
# the manufacturer's datasheet (hardware/README.md). Quality profiles only trade the OAK-D's
# resolution and rate for simulation speed - its native 4056x3040 colour frame is too heavy to
# render live. Noise is a property of the sensor, so it is the same in every profile.
# Select with `quality:=low|medium|high`.

airframe:
  # Bespoke Hexa-X on the team's own frame (hardware/cad/hexacopter_frame, meshed into
  # meshes/hexacopter_frame.glb with base_link midway between its plates). Flight physics are
  # ArduPilot's own Gazebo parts (ArduPilotPlugin, the iris rotor's LiftDrag blades and prop mesh:
  # generic until motors and props are bought); motor order in render.HEXA_X, SITL frame in hexa.parm.
  arm_m: 0.567                # frame CAD: hub centre to motor mount
  motor_mount_top_m: 0.0236   # frame CAD: top of the motor mounts above base_link
  plate_stack_m: [0.402, 0.435, 0.100]   # frame CAD: centre plates, top to bottom (collision)
  skids:                      # frame CAD: the landing gear's two tubes with their end caps
    y_m: 0.1969               # either side of the centre line
    z_m: -0.5669              # tube axis below base_link
    radius_m: 0.0156          # end-cap radius: what touches the ground (worlds.GEAR_HEIGHT_M)
    length_m: 0.531
  # 6S 10000 mAh LiPo strapped under the bottom plate. Typical size for the class until the
  # exact pack is chosen.
  battery_size_m: [0.200, 0.077, 0.063]
  battery_strap_x_m: [-0.07, 0.07]    # two straps round the battery and the bottom plate
  camera_mount:               # tray below the battery, hung from the bottom plate by two side plates
    tray_size_m: [0.060, 0.140, 0.004]
    clearance_m: 0.002        # tray to battery: the tray hangs from the frame, not the battery
    hanger_thickness_m: 0.003
    lepton_carrier_m: [0.030, 0.022, 0.0159]   # board between tray and Lepton: faces flush with the OAK-D
  # Labelled boxes at the parts' published sizes (tools/make_label_box.py, meshes/*.glb):
  #   Pixhawk 6C Mini 54.3x39x17.5 mm (Holybro, Model A); Qualcomm RB5 dev kit 85x54 mm
  #   (Thundercomm, 96Boards), 20 mm tall with SoM and heatsink (estimate); Readytosky 45A ESC
  #   28.5x13 mm, ~6 mm in heat-shrink. The FC and RB5 sit on the bottom plate in the bay between
  #   the plates, under the top plate's opening, the FC stacked on the PDB; an ESC is tied under each arm.
  avionics:
    flight_controller: {mesh: flight_controller.glb, size_m: [0.0543, 0.039, 0.0175], xy_m: [0.035, 0.0]}
    companion_computer: {mesh: companion_computer.glb, size_m: [0.085, 0.054, 0.020], xy_m: [-0.062, 0.0]}
    esc: {mesh: esc.glb, size_m: [0.0285, 0.013, 0.006], arm_radius_m: 0.30}
    # power distribution board under the FC (the usual stack): battery lead in, one lead out to
    # each ESC; the FC stands on standoffs above it (generic 36 mm board)
    pdb: {mesh: pdb.glb, size_m: [0.036, 0.036, 0.004], standoff_m: 0.008}
    # Holybro M10 GPS puck 50 mm x 14.4 mm on its folding mast with the 140 mm carbon rod, at the
    # back of the top plate between the rear arms: clear of the props and the cameras.
    gps: {puck_diameter_m: 0.050, puck_height_m: 0.0144, mast_m: 0.140, base_m: [0.026, 0.026, 0.015], xy_m: [-0.155, 0.0]}
  arm_underside_z_m: -0.014   # frame CAD: bottom of the 30 mm arm tubes
  plate_inner_z_m: -0.040     # frame CAD: top face of the bottom plate (floor of the bay)
  plate_top_z_m: 0.050        # frame CAD: top face of the top plate
  body_mass_kg: 2.2           # not yet the real build's: weigh it, or add up datasheet masses
  # ixx, iyy scaled from the first flown design (0.30 m arms) by the arm length, so attitude response
  # per rotor torque stays where ArduPilot's default gains fly it.
  body_inertia: [0.038, 0.038, 0.05]
  motor_max_rad_s: 838        # generic motor at full throttle (the iris motor: ~8000 rpm)
  # How the generic motors and props look. The size class a 400-450 KV 6S motor swings (5008-class
  # outrunner, 17" prop); thrust is still the iris rotor model above, only the visual is scaled.
  motor_look: {diameter_m: 0.056, height_m: 0.032}
  prop_visual_scale: 1.65     # the iris 10" prop mesh drawn at ~17"

mount:                        # payload_link in the airframe (FLU, metres): the cameras' front face
  # Under the camera tray: bottom plate -0.05, battery 0.063, clearance 0.002, tray 0.004,
  # OAK-D 0.0231 deep (tested against the airframe numbers).
  xyz: [0.0, 0.0, -0.1421]
  camera_pitch_rad: 1.5708    # straight down; RGB, depth and thermal share the tilt and optical centre
  thermal_mesh_offset_y_m: 0.058   # Lepton mesh to the OAK-D's left (visual only, see drone.sdf.jinja)

rgb:                          # OAK-D Pro W colour camera, OV9782 global shutter (1280x800)
  hfov_rad: 2.2166            # 127 deg
  clip_m: [0.3, 300.0]
  noise_stddev: 0.007         # fraction of full scale per channel
depth:                        # OAK-D Pro W stereo pair, OV9282, 75 mm baseline
  hfov_rad: 2.2166            # 127 deg
  clip_m: [0.7, 12.0]         # Luxonis' ideal depth range: nothing reads at search altitude
  noise_stddev: 0.02          # metres
stereo:                       # OAK-D Pro W's OV9282 pair as the two mono images VIO tracks (OpenVINS)
  baseline_m: 0.075           # Luxonis: 75 mm between the stereo cameras
  # The real lens is 127 deg; gz renders a pinhole camera, which at 127 deg stretches the edges
  # beyond what a pinhole model tracks well, so the sim renders the central 90 deg. A real build
  # calibrates the full lens with an equidistant (fisheye) model instead.
  hfov_rad: 1.5708
  clip_m: [0.3, 300.0]
  noise_stddev: 0.007         # fraction of full scale, as the colour camera
thermal:                      # LWIR core at 256x192 (fixed, so not part of the quality profiles)
  hfov_rad: 0.9948            # 57 deg, as the Lepton 3.5 this replaced
  # 256x192, as 12 um uncooled cores (InfiRay Tiny1-C class) ship; the Lepton 3.5 is 160x120.
  # The exact part is not chosen yet: its lens, rate and range replace the Lepton figures here.
  # The model keeps the Lepton 3.5 mesh (flir_lepton_3_5.glb) until the new part's CAD arrives.
  width: 256
  height: 192
  rate_hz: 8.6
  clip_m: [0.3, 150.0]
  # The real Lepton reads -10 to 400 C (low gain). The sim keeps 600 K: L16 counts x resolution_k
  # must reach max_temp, and 673 K would need a coarser scale than the 0.01 K below.
  temp_range_k: [253.15, 600.0]   # must still cover fire (550 K, Phase 14)
  # Measured: gz renders heat sources through an 8-bit path, so the real step is 256 *
  # resolution_k (2.6 K here), whatever min/max say - narrowing the range changed nothing.
  # Covering 600 K forces resolution_k >= 0.01, so ~2.6 K is the floor: scene surfaces must
  # therefore differ from body heat by more than one step (see the world's LWIR temperatures),
  # and perception must not assume finer than 2.6 K.
  resolution_k: 0.01          # scale of the L16 counts (1 count = 0.01 K), not the precision
  # No noise_stddev: gz-sensors 8 segfaults on <noise> in a thermal camera.
imu:                          # OAK-D Pro W's BNO086; the flight IMU stays noise-free for SITL
  rate_hz: 200                # VIO integrates between frames: OpenVINS wants 200 Hz or more
  gyro_stddev: 0.0009         # rad/s
  accel_stddev: 0.017         # m/s^2
baro:                         # flight controller's barometer
  rate_hz: 10
  noise_stddev: 5.0           # Pa (~0.4 m)

profiles:                     # OAK-D resolution and rate only (both sensors 16:10, 1280x800 native)
  low:
    rgb:     {width: 640,  height: 400, rate_hz: 5}
    depth:   {width: 640,  height: 400, rate_hz: 5}
    stereo:  {width: 640,  height: 400, rate_hz: 15}
  medium:
    rgb:     {width: 960,  height: 600, rate_hz: 10}
    depth:   {width: 1280, height: 800, rate_hz: 5}
    stereo:  {width: 640,  height: 400, rate_hz: 20}
  high:
    rgb:     {width: 1280, height: 800, rate_hz: 15}
    depth:   {width: 1280, height: 800, rate_hz: 10}
    stereo:  {width: 1280, height: 800, rate_hz: 30}
