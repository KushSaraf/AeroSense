# Ground truth for the Aero Sense scenarios: where the victims are, how warm they are, and how
# hard they are to see. The launch spawns one Gazebo model per entry; victim_ground_truth
# republishes the same table on /aero_sense/ground_truth/victims.
#
# Ground truth is a simulation aid only (evaluation and sensor realism). Perception must find
# these by looking, and the dashboard must never read this file.
#
# state:        lying | seated | prone | trapped | deceased  (the evidence a searcher can expect,
#               not the detection itself)
# character:    man | woman | nurse | kid - who it is (tools/make_people.py poses the Fuel model)
# pose:         supine | prone | seated | seated_waving | standing | standing_waving | reaching |
#               leaning | leaning_waving - how they lie, sit or stand (a *_waving pose for motion waving)
# temperature_k LWIR skin temperature. Ambient is 293 K, so a live casualty stands out by 12-17 K;
#               a deceased one barely at all.
# visibility:   full | partial | buried - how much of the body any camera can see. partial and
#               buried put broken slabs and brick over the body (victim_models.py); a buried casualty
#               shows only as a faint warm patch on the pile (alive) or not at all (deceased). A
#               casualty beside or inside a structure is `partial` because the walls hide part of it.
# exposed:      upper_body | feet | hand (optional, partial only) - which part shows from the rubble:
#               legs under it, only the feet, or only a forearm and hand reaching out of it.
# perch:        car_roof | terrace | window (optional, flood only) - where someone waits for rescue
#               above the water: standing on a car roof, on a house's roof terrace, or leaning out of
#               an upper-floor window. tools/layout_world.py builds the car or house round them and
#               checks z, which is the floor they stand on (terrain + roof or floor height).
# motion:       none | waving | crawling (optional, default none) - living, visible casualties only;
#               what separates alive from dead when heat alone cannot.
#
# Priority (expected_priority), the rules the priority-based search is scored on (tested):
#   P1  alive and cannot get out: buried, pinned with only a hand or feet showing, or cut off by water
#   P2  alive, injured, partly able: seated/lying in the open or beside structures, crawling
#   P3  deceased (and the least urgent of the living, where a scenario has one)
# expected_priority: what a correct triage engine should conclude (Phase 10 scores itself on this).
#
# Positions sit beside structures, never inside their meshes: a victim placed under a collapsed
# building is invisible to every sensor, which silently makes a scenario unsolvable.

