  # --- Trapped inside collapsed buildings. `inside_structure` marks this as deliberate: the
  # clearance test rejects any *other* victim inside a mesh, because that is normally an
  # accident that makes a casualty invisible to every sensor. These are the hard cases a real
  # search faces: findable only where the roof has come away, and a drone honestly cannot see
  # the rest from above.
