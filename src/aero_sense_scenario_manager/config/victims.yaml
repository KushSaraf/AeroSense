# Ground truth for the Aero Sense scenarios: where the victims are, how warm they are, and how
# hard they are to see. The launch spawns one Gazebo model per entry; victim_ground_truth
# republishes the same table on /aero_sense/ground_truth/victims.
#
# Ground truth is a simulation aid only (evaluation and sensor realism). Perception must find
# these by looking, and the dashboard must never read this file.
#
# state:        lying | seated | prone | trapped | deceased  (drives pose and the evidence a
#               searcher can expect, not the detection itself)
# temperature_k LWIR skin temperature. Ambient is 293 K, so a live casualty stands out by 12-17 K;
#               a deceased one barely at all.
# occlusion:    none | partial | heavy - how much rubble/structure hides the body from above.
# expected_priority: what a correct triage engine should conclude (Phase 10 scores itself on this).
#
# Positions sit beside structures, never inside their meshes: a victim placed under a collapsed
# building is invisible to every sensor, which silently makes a scenario unsolvable.
#
# No roll/pitch: the manikin's model origin sits below the body, so rolling it sinks half the
# casualty underground and thermal loses them. State is carried by placement and context.

victims:
  - id: V01
    state: lying
    x: -176.0
    y: 21.5
    yaw_deg: 20
    temperature_k: 309.0
    occlusion: partial
    expected_priority: P2
    note: in a 4 m lane between terraces, visible only from near-vertical

