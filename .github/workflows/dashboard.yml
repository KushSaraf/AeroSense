# CI for the dashboard: it must build, live and in replay.
# The repository is private, so there is no GitHub Pages deployment (Pages needs a public repo on
# the free plan). tools/dashboard.sh runs the live system; VITE_REPLAY=1 replays a recorded flight.
name: Build dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
        env:
          VITE_REPLAY: '1'
